<!doctype html>
<html lang="en" data-theme="dark" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <!--
      No CSP <meta> here: the main process's `onHeadersReceived` response
      header (apps/desktop/src/main/index.ts) is the single, dev-aware
      source of truth. A hardcoded meta tag would diverge from it (e.g. it
      cannot relax `connect-src` for Vite's HMR websocket in dev) and, per
      the CSP spec, the stricter of two policies wins anyway, so it would
      have silently broken dev without ever helping production.
    -->
    <title>coa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
