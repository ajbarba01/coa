# Workspace globs. apps/* are created at their build phase (M10); the glob is
# inert until then. Libraries (the logical modules) live under packages/*.
packages:
  - packages/*
  - apps/*

# Native addons that legitimately need build scripts. Everything else runs with
# scripts ignored by default (supply-chain hygiene). These rebuild for the
# daemon's Node ABI. electron/esbuild are explicitly pinned to false: their
# postinstalls only fetch runtime/prebuilt binaries (Electron's app binary,
# esbuild's own native binary) — not required to typecheck or bundle the
# desktop app, so they stay off by default; flip to true if interactive
# `dev`/packaging needs the fetched binaries.
allowBuilds:
  better-sqlite3: true
  '@parcel/watcher': true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  electron: false
  esbuild: false

# @types/node 26 is newer than the default minimum-release-age window; allow it.
minimumReleaseAgeExclude:
  - '@types/node@26.0.1'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.196'
  - '@anthropic-ai/claude-agent-sdk@0.3.196'
  - '@anthropic-ai/sdk@0.107.0'
